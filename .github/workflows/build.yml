name: Build

on:
  push:
    tags: ['v*']        # git tag v1.3.0 && git push origin v1.3.0
  workflow_dispatch:     # manual run from the Actions tab (builds but does not publish)

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (AppImage)
            os: ubuntu-latest
            script: dist:linux
            artifact: clipeer-linux
          - name: macOS (arm64 + x64)
            os: macos-latest
            script: dist:mac
            artifact: clipeer-macos
          - name: Windows (exe)
            os: windows-latest
            script: dist:win
            artifact: clipeer-windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The app version is taken from the tag (v1.3.0 -> 1.3.0)
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          # no signing certificate: stops electron-builder from looking for one
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.exe
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
