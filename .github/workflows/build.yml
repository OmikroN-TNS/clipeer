name: Build

on:
  push:
    tags: ['v*']        # git tag v1.3.0 && git push origin v1.3.0
  workflow_dispatch:     # manual run from the Actions tab (builds but does not publish)

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (AppImage)
            os: ubuntu-latest
            script: dist:linux
            artifact: clipeer-linux
          - name: macOS (arm64 + x64)
            os: macos-latest
            script: dist:mac
            artifact: clipeer-macos
          - name: Windows (exe)
            os: windows-latest
            script: dist:win
            artifact: clipeer-windows

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The app version is taken from the tag (v1.3.0 -> 1.3.0)
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.exe
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # The description given to scripts/release.sh is the message of the tag
      - name: Read the release description from the tag
        run: |
          git fetch --force --tags origin
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
          cat release-notes.md

      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body_path: release-notes.md      # your description first...
          generate_release_notes: true     # ...then the list of changes generated by GitHub
